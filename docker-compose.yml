services:

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: postgres-pinecone-ai

    env_file:
      - .env

    volumes:
      - .:/app

    ports:
      - "8000:8000"
     
    depends_on:
      postgres:
        condition: service_healthy

    #command: python run.py
    command: tail -f /dev/null

  postgres:
    image: postgres:18

    container_name: postgres-pinecone-postgres

    environment:
      POSTGRES_DB: ecommerce_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest

    container_name: postgres-pinecone-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama    

volumes:
  postgres_data:
  ollama_data: